<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightread — What's the read on tonight?</title>
<meta name="description" content="Dead or lit? Know before you go. See which bars and clubs are packed, live. Coming soon to Atlanta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --red: #E5202E; --bg: #070708; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 35%, #1a0507 0%, var(--bg) 60%);
    color: #f4f4f5; font-family: Inter, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px 20px; min-height: 100vh;
  }
  .logo { font-family: Monoton, cursive; font-weight: 400; line-height: 1.05;
    font-size: clamp(56px, 13vw, 150px); letter-spacing: 0.02em; }
  .night { color: #fff; text-shadow: 0 0 6px #fff, 0 0 18px rgba(255,255,255,.55); }
  .read { color: var(--red); text-shadow: 0 0 6px var(--red), 0 0 22px var(--red), 0 0 48px rgba(229,32,46,.6);
    animation: flicker 6s infinite; }
  @keyframes flicker { 0%,92%,100% { opacity: 1 } 93% { opacity: .55 } 94% { opacity: 1 } 96% { opacity: .7 } 97% { opacity: 1 } }
  .tag { margin-top: 28px; font-size: clamp(20px, 3.2vw, 30px); font-weight: 600; }
  .sub { margin-top: 14px; color: #b4b4bb; font-size: clamp(15px, 2vw, 18px); max-width: 560px; line-height: 1.55; }
  .badge { margin-top: 30px; display: inline-block; padding: 10px 20px; border: 1px solid var(--red);
    border-radius: 999px; color: #fff; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px;
    box-shadow: 0 0 18px rgba(229,32,46,.35); }
  .social { margin-top: 36px; display: flex; gap: 22px; justify-content: center; }
  .social a { color: #d4d4d8; text-decoration: none; font-weight: 600; font-size: 15px; }
  .social a:hover { color: var(--red); }
  footer { margin-top: 56px; color: #6b6b73; font-size: 12px; }
</style>
</head>
<body>
  <h1 class="logo"><span class="night">NIGHT</span><br><span class="read">READ</span></h1>
  <p class="tag">What's the read on tonight?</p>
  <p class="sub">Dead or lit? Know before you go. See which bars &amp; clubs are packed, live. Don't waste your night.</p>
  <span class="badge">Coming soon · Atlanta</span>
  <nav class="social">
    <a href="https://www.instagram.com/nightreadai" target="_blank" rel="noopener">Instagram @nightreadai</a>
    <a href="https://x.com/nightreadai" target="_blank" rel="noopener">X @nightreadai</a>
  </nav>
  <footer>© 2026 Nightread · 21+ · Please drink responsibly.</footer>
</body>
</html>
